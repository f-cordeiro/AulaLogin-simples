<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - SENAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --senai-blue: #164194;
            --senai-blue-light: #0088D2;
            --senai-orange: #E84910;
            --bg-color: #f4f7f9;
            --text-color: #333;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-top: 8px solid var(--senai-blue);
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 900;
            font-style: italic;
            color: var(--senai-blue);
            margin-bottom: 1.5rem;
        }

        .logo-text span {
            color: var(--senai-orange);
        }

        h1 {
            color: var(--senai-blue);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .user-card {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: var(--senai-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-details b {
            display: block;
            color: var(--senai-blue);
        }

        .user-details span {
            font-size: 0.9rem;
            color: #888;
        }

        .btn-logout {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: transparent;
            color: var(--senai-blue);
            border: 2px solid var(--senai-blue);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background-color: var(--senai-blue);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-text">SENA<span>I</span></div>
        
        <h1>Bem-vindo!</h1>
        <p>Você acessou o portal com sucesso. Explore nossos recursos e cursos disponíveis.</p>

        <div class="user-card">
            <div class="user-details">
                <b>{{usuario.nome }}</b>
                <span>{{usuario.email}}</span>
            </div>
        </div>

        <a href="/login" class="btn-logout">Sair da Conta</a>
    </div>

</body>
</html>
